use_cases:
  - id: "UC-CM-001"
    title: "Submit Complaint"
    description: "Authenticated user submits a complaint with details, priority, and optional attachments."
    actors: "Student/Faculty/Staff"
    preconditions: "User is authenticated. Complaint categories and locations are pre-configured."
    happy_paths:
      - scenario: "User submits complaint with all mandatory fields and valid attachment"
        preconditions: "User is authenticated, categories and locations are configured"
        input_action: "POST /complaints with category=valid, location=valid, description=non-empty, priority=Standard, attachment=valid_pdf"
        expected_result: "Complaint created with unique ID and status=Pending. Auto-assigned to caretaker. SLA timer started. Notifications sent."
      - scenario: "User submits complaint without attachment (optional)"
        preconditions: "User is authenticated"
        input_action: "POST /complaints with category=valid, location=valid, description=non-empty, priority=Urgent, no attachment"
        expected_result: "Complaint created with status=Pending. SLA=24h applied. Auto-assigned to caretaker."
    alternate_paths:
      - scenario: "Missing mandatory fields — category is null"
        preconditions: "User is authenticated"
        input_action: "POST /complaints with category=null, location=valid, description=non-empty"
        expected_result: "Submission rejected with validation error: category is required"
      - scenario: "Attachment exceeds size limit or has invalid file type"
        preconditions: "User is authenticated"
        input_action: "POST /complaints with valid fields, attachment=oversized_or_invalid_type"
        expected_result: "File rejected with error. User prompted to retry with valid file."
      - scenario: "Auto-assignment fails — no caretaker mapping found"
        preconditions: "User is authenticated, assignment policy has a gap"
        input_action: "POST /complaints with category and location not covered in assignment policy"
        expected_result: "Complaint created with status=Pending-Assignment and escalated for manual assignment."
    exception_paths:
      - scenario: "Complaint submitted with empty description"
        preconditions: "User is authenticated"
        input_action: "POST /complaints with category=valid, location=valid, description=''"
        expected_result: "Submission rejected with error: description cannot be empty"

  - id: "UC-CM-002"
    title: "Track Complaint Status"
    description: "Complainant or authorized user views real-time status and history of complaints."
    actors: "Student/Faculty/Staff"
    preconditions: "User is authenticated. At least one complaint exists."
    happy_paths:
      - scenario: "User views list of own complaints and selects one for details"
        preconditions: "User is authenticated and has at least one complaint"
        input_action: "GET /complaints/my → select complaint_id=valid"
        expected_result: "Full complaint details shown: status timeline, assigned personnel, SLA deadline, history."
    alternate_paths:
      - scenario: "User has no complaints"
        preconditions: "User is authenticated but has submitted no complaints"
        input_action: "GET /complaints/my"
        expected_result: "System displays empty state message: no complaints found."
      - scenario: "User attempts to view another user's complaint without authorization"
        preconditions: "User is authenticated"
        input_action: "GET /complaints/{other_user_complaint_id}"
        expected_result: "Access denied with authorization error."
    exception_paths: []

  - id: "UC-CM-003"
    title: "Update Complaint Progress"
    description: "Caretaker updates assigned complaints with progress and resolution details."
    actors: "Caretaker"
    preconditions: "Caretaker is authenticated. Complaint is assigned to the caretaker."
    happy_paths:
      - scenario: "Caretaker updates complaint status to In Progress with notes"
        preconditions: "Caretaker is authenticated and complaint is assigned"
        input_action: "PATCH /complaints/{id} with status=In Progress, notes=non-empty, estimated_resolution_time=optional"
        expected_result: "Complaint status updated. Action logged. Complainant and supervisor notified."
      - scenario: "Caretaker marks complaint as Resolved with resolution notes"
        preconditions: "Caretaker is authenticated and complaint is In Progress"
        input_action: "PATCH /complaints/{id} with status=Resolved, resolution_notes=non-empty"
        expected_result: "Complaint status updated to Resolved. Complainant notified for verification."
    alternate_paths:
      - scenario: "Caretaker attempts invalid status transition"
        preconditions: "Caretaker is authenticated"
        input_action: "PATCH /complaints/{id} with status=Closed (invalid for caretaker)"
        expected_result: "Update rejected with invalid status transition error."
      - scenario: "Issue is out of scope — caretaker escalates instead"
        preconditions: "Caretaker is authenticated"
        input_action: "Caretaker selects Escalate option with justification"
        expected_result: "Complaint routed to escalation flow (UC-CM-004)."
    exception_paths: []

  - id: "UC-CM-004"
    title: "Escalate Complaint (Manual/Automatic)"
    description: "Caretaker escalates complaint manually or system auto-escalates on SLA breach."
    actors: "Caretaker, System"
    preconditions: "Complaint is unresolved within SLA, or caretaker initiates manual escalation."
    happy_paths:
      - scenario: "Caretaker manually escalates complaint with justification"
        preconditions: "Caretaker is authenticated, complaint is assigned"
        input_action: "POST /complaints/{id}/escalate with justification=non-empty"
        expected_result: "Complaint status updated to Escalated. Reassigned to Supervisor. Supervisor notified."
      - scenario: "System auto-escalates complaint after SLA breach"
        preconditions: "Complaint is not resolved, time_since_creation > SLA_timeframe"
        input_action: "System scheduler detects SLA breach for complaint_id"
        expected_result: "Complaint status updated to Escalated. Reassigned to Supervisor. Supervisor notified."
    alternate_paths:
      - scenario: "Caretaker attempts escalation without providing justification"
        preconditions: "Caretaker is authenticated"
        input_action: "POST /complaints/{id}/escalate with justification=''"
        expected_result: "Escalation rejected with error: justification is required."
      - scenario: "System error during escalation notification"
        preconditions: "SLA breach detected"
        input_action: "System attempts to send escalation notification"
        expected_result: "Error logged. System retries notification delivery."
    exception_paths: []

  - id: "UC-CM-005"
    title: "Verify & Close Complaint"
    description: "Complainant or Supervisor verifies resolution; complaint closed after verification."
    actors: "Complainant, Supervisor"
    preconditions: "Complaint is marked Resolved by caretaker."
    happy_paths:
      - scenario: "Complainant accepts resolution — complaint closed"
        preconditions: "Complaint status=Resolved, complainant is authenticated"
        input_action: "POST /complaints/{id}/verify with action=accept"
        expected_result: "Complaint status updated to Closed. Feedback prompt triggered."
      - scenario: "Supervisor verifies resolution and closes complaint"
        preconditions: "Complaint status=Resolved, supervisor is authenticated"
        input_action: "POST /complaints/{id}/verify with action=accept, verifier_role=Supervisor"
        expected_result: "Complaint closed. Feedback prompt sent to complainant."
    alternate_paths:
      - scenario: "Complainant rejects resolution — complaint reopened"
        preconditions: "Complaint status=Resolved, complainant is authenticated"
        input_action: "POST /complaints/{id}/verify with action=reject"
        expected_result: "Complaint status reverted to Reopened or reassigned."
      - scenario: "No response from complainant — supervisor verifies or system auto-closes"
        preconditions: "Complaint status=Resolved, complainant has not responded within window"
        input_action: "System timeout or supervisor override"
        expected_result: "Complaint auto-closed or closed by supervisor. Feedback prompt sent."
    exception_paths: []

  - id: "UC-CM-006"
    title: "Request Complaint Reopening"
    description: "Complainant requests reopening of a closed complaint if dissatisfied."
    actors: "Complainant"
    preconditions: "Complaint is in Closed state."
    happy_paths:
      - scenario: "Complainant requests reopen with valid justification within allowed window"
        preconditions: "Complaint status=Closed, complainant is authenticated, within reopen window"
        input_action: "POST /complaints/{id}/reopen with justification=non-empty"
        expected_result: "Complaint status updated to Reopened. Supervisor notified and complaint reassigned."
    alternate_paths:
      - scenario: "Complainant submits reopen request without justification"
        preconditions: "Complaint status=Closed, complainant is authenticated"
        input_action: "POST /complaints/{id}/reopen with justification=''"
        expected_result: "Request rejected with error: justification is required."
      - scenario: "Reopen request submitted outside allowed time window"
        preconditions: "Complaint status=Closed, reopen window has expired"
        input_action: "POST /complaints/{id}/reopen with justification=non-empty"
        expected_result: "Request denied with error: reopen window has expired."
    exception_paths: []

  - id: "UC-CM-007"
    title: "Provide Feedback on Complaint Resolution"
    description: "Complainant provides feedback on service after complaint closure."
    actors: "Complainant"
    preconditions: "Complaint is in Closed state."
    happy_paths:
      - scenario: "Complainant submits rating and comments after closure"
        preconditions: "Complaint status=Closed, system has prompted feedback"
        input_action: "POST /complaints/{id}/feedback with rating=4, comments=non-empty"
        expected_result: "Feedback stored and linked to complaint. Admin notified for analysis."
    alternate_paths:
      - scenario: "Complainant skips feedback prompt"
        preconditions: "Complaint status=Closed"
        input_action: "User dismisses feedback prompt without submitting"
        expected_result: "No feedback record created. Complaint remains closed."
    exception_paths: []

  - id: "UC-CM-008"
    title: "Generate Reports & Analytics"
    description: "Supervisors/Admins generate analytical and performance reports."
    actors: "Supervisor, Admin"
    preconditions: "Historical complaint data exists."
    happy_paths:
      - scenario: "Supervisor generates report filtered by date range and category"
        preconditions: "Supervisor is authenticated, historical data exists"
        input_action: "GET /reports with filters: date_range=last_month, category=Maintenance"
        expected_result: "Report generated showing complaint frequency, resolution times, and trends for the filter."
    alternate_paths:
      - scenario: "No complaint data available for selected filters"
        preconditions: "Supervisor is authenticated, no data matches filters"
        input_action: "GET /reports with filters that return no results"
        expected_result: "Empty report displayed with message: no data available for selected filters."
    exception_paths: []

  - id: "UC-CM-009"
    title: "SLA Reminder Notification"
    description: "System sends notifications to caretakers and supervisors when complaints approach SLA deadlines."
    actors: "System"
    preconditions: "Complaint exists with SLA deadline set."
    happy_paths:
      - scenario: "System sends reminder when SLA deadline is approaching threshold"
        preconditions: "Complaint is unresolved, now() + notification_threshold > SLA_deadline"
        input_action: "System scheduler evaluates complaint SLA deadlines"
        expected_result: "Reminder notification sent to caretaker and supervisor. Reminder logged in complaint history."
    alternate_paths:
      - scenario: "Notification delivery fails"
        preconditions: "Reminder triggered but delivery service fails"
        input_action: "System attempts to send SLA reminder notification"
        expected_result: "Error logged. System retries notification delivery."
    exception_paths: []

  - id: "UC-CM-010"
    title: "Auto Escalation"
    description: "System automatically escalates overdue complaints after SLA breach."
    actors: "System"
    preconditions: "Complaint SLA has been exceeded."
    happy_paths:
      - scenario: "System detects SLA breach and escalates complaint to Supervisor"
        preconditions: "Complaint status not in {Resolved, Closed}, time_since_creation > SLA_timeframe"
        input_action: "System scheduler detects overdue complaint"
        expected_result: "Complaint status updated to Escalated. Reassigned to Supervisor. Supervisor notified."
    alternate_paths:
      - scenario: "Escalation notification fails during auto-escalation"
        preconditions: "Auto-escalation triggered, notification service unavailable"
        input_action: "System attempts to notify Supervisor"
        expected_result: "Error logged. System retries notification."
    exception_paths:
      - scenario: "Complaint remains unresolved beyond SLA despite escalation"
        preconditions: "Complaint already escalated but Supervisor has not acted"
        input_action: "System scheduler re-checks escalated complaint"
        expected_result: "Complaint remains unresolved. Admin notified for intervention."

  - id: "UC-CM-011"
    title: "Reopen Complaint"
    description: "Complainant requests reopening of a complaint that was marked closed or resolved."
    actors: "Complainant"
    preconditions: "Complaint status is Closed or Resolved."
    happy_paths:
      - scenario: "Complainant submits reopen request with justification within allowed timeframe"
        preconditions: "Complaint status=Closed, request within allowed window, justification provided"
        input_action: "POST /complaints/{id}/reopen with justification=non-empty"
        expected_result: "Complaint status updated to Reopened. Supervisor notified. Complaint reassigned."
    alternate_paths:
      - scenario: "Reopen request submitted outside allowed timeframe"
        preconditions: "Complaint status=Closed, reopen window has expired"
        input_action: "POST /complaints/{id}/reopen with justification=non-empty"
        expected_result: "Request rejected with error: outside allowed reopen timeframe."
      - scenario: "Reopen request submitted without justification"
        preconditions: "Complaint status=Closed, within allowed window"
        input_action: "POST /complaints/{id}/reopen with justification=''"
        expected_result: "Request rejected automatically with error: justification required."
    exception_paths: []

  - id: "UC-CM-012"
    title: "Admin Oversight"
    description: "Admin monitors unresolved complaints and intervenes for overdue or escalated cases."
    actors: "Admin"
    preconditions: "Complaint is unresolved or escalated without resolution."
    happy_paths:
      - scenario: "Admin reviews overdue complaints dashboard and reassigns"
        preconditions: "Admin is authenticated, overdue/escalated complaints exist"
        input_action: "GET /admin/complaints?status=Overdue → PATCH /complaints/{id}/assign with new_caretaker=valid"
        expected_result: "Complaint reassigned. Admin intervention logged in complaint history."
    alternate_paths:
      - scenario: "Admin cannot find available caretaker — escalates to Service Authority"
        preconditions: "Admin is authenticated, no caretaker available"
        input_action: "Admin selects escalate to Service Authority option"
        expected_result: "Complaint escalated to Service Authority."
    exception_paths: []
